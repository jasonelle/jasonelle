# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3.17"

tasks:
  default:
    cmds:
      - task build

  build:
    aliases:
      - b
    desc: Build all Android modules
    cmds:
      - ./gradlew assembleDebug

  test:
    aliases:
      - t
    desc: Run unit tests across all Android modules
    cmds:
      - ./gradlew test

  assemble:
    aliases:
      - a
    desc: Assemble debug APK
    cmds:
      - ./gradlew :Application:assembleDebug

  lint:
    aliases:
      - l
    desc: Run lint on Android sources
    cmds:
      - ./gradlew lint

  format:
    aliases:
      - f
    desc: Format Kotlin sources with ktlint
    cmds:
      - ./gradlew ktlintFormat

  clean:
    aliases:
      - c
    desc: Clean build outputs
    cmds:
      - ./gradlew clean
